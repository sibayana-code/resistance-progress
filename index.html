<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <title>Resistance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <h1>Resistance</h1>
      <p class="tag">Abo Sibayan · Philippines</p>
    </div>
  </header>

  <main id="app">
    <noscript><p class="err">This page reads the snapshot in data.json. Turn JavaScript on.</p></noscript>
  </main>

  <footer>Source of truth stays in the private resistance-log.</footer>

  <script>
    const MUSCLE_ORDER = [
      "Chest", "Abs", "Biceps", "Triceps",
      "Quads / glutes", "Shoulders", "Back", "Calves"
    ];
    const WINDOW_DAYS = 28;
    const BODYWEIGHT_KG = 75;
    const BW_REP_KG = 0.65 * BODYWEIGHT_KG;

    function parseISO(iso) {
      const [y, m, d] = iso.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(iso, n) {
      const dt = parseISO(iso);
      dt.setDate(dt.getDate() + n);
      const mm = String(dt.getMonth() + 1).padStart(2, "0");
      const dd = String(dt.getDate()).padStart(2, "0");
      return `${dt.getFullYear()}-${mm}-${dd}`;
    }

    function formatPH(iso, weekday = "long") {
      const dt = parseISO(iso);
      const w = dt.toLocaleDateString("en-PH", { weekday });
      const month = dt.toLocaleDateString("en-PH", { month: "short" });
      return `${w} ${dt.getDate()} ${month}`;
    }

    function shortPH(iso) {
      const dt = parseISO(iso);
      const month = dt.toLocaleDateString("en-PH", { month: "short" });
      return `${dt.getDate()} ${month}`;
    }

    function rirStatus(set) {
      if (set.effort === "too easy") return "easy";
      if (set.rir == null || set.rir === "") return "blank";
      const lo = Array.isArray(set.rir) ? set.rir[0] : set.rir;
      const hi = Array.isArray(set.rir) ? set.rir[1] : set.rir;
      if (hi >= 2 && lo <= 3) return "hit";
      if (lo > 3) return "easy";
      return "miss";
    }

    function formatRir(set) {
      if (set.effort === "too easy") return "too easy";
      if (set.rir == null || set.rir === "") return "RIR —";
      if (Array.isArray(set.rir)) return `RIR ${set.rir[0]}–${set.rir[1]}`;
      return `RIR ${set.rir}`;
    }

    function formatLoad(set) {
      if (set.load === "bw") return "BW";
      if (typeof set.load === "number") return `${set.load} kg`;
      return null;
    }

    function formatSetDose(set) {
      if (set.seconds) return `${set.seconds}s`;
      const count = set.count || 1;
      if (set.reps == null) return null;
      return `${count}×${set.reps}`;
    }

    function formatLine(set) {
      return [set.exercise, formatSetDose(set), formatLoad(set), formatRir(set)]
        .filter(Boolean)
        .join(" · ");
    }

    function expandInstances(session) {
      const out = [];
      for (const set of session.sets) {
        const n = set.count || 1;
        for (let i = 0; i < n; i++) out.push({ session, set });
      }
      return out;
    }

    function dose(set) {
      const n = set.count || 1;
      const repsEq = set.reps != null ? set.reps : (set.seconds || 0);
      const kg = typeof set.load === "number" ? set.load : 0;
      let value = n * repsEq * (kg === 0 ? 1 : kg / BW_REP_KG);
      if (set.effort === "too easy") value *= 0.5;
      return value;
    }

    function countedLifts(session) {
      return session.sets.filter((s) => !s.extra).length;
    }

    function windowDays(asOf) {
      const start = addDays(asOf, -(WINDOW_DAYS - 1));
      const days = [];
      for (let i = 0; i < WINDOW_DAYS; i++) days.push(addDays(start, i));
      return { start, end: asOf, days };
    }

    function barPct(value, max) {
      if (!max) return 0;
      return Math.max(8, Math.round((value / max) * 100));
    }

    function renderStrip(days, marks, max, aria) {
      const start = days[0];
      const end = days[days.length - 1];
      return `
        <div class="strip-chart" role="img" aria-label="${aria}">
          <div class="strip">
            ${days.map((iso) => {
              const mark = marks.get(iso);
              if (!mark) {
                return `<span class="slot" title="${shortPH(iso)}"></span>`;
              }
              const pct = barPct(mark.dose, max);
              return `<span class="slot" title="${mark.title}"><span class="bar ${mark.cls}" style="height:${pct}%"></span></span>`;
            }).join("")}
          </div>
          <div class="strip-axis">
            <span>${shortPH(start)}</span>
            <span>${shortPH(end)}</span>
          </div>
        </div>`;
    }

    function render(data) {
      const sessions = data.sessions;
      const lastComplete = sessions.find((s) => s.status === "complete");
      const nextDue = addDays(lastComplete.date, data.rules.maxGapDays);
      const counted = countedLifts(lastComplete);

      const rirSets = sessions
        .filter((s) => !s.superseded)
        .flatMap(expandInstances);
      const rir = { hit: 0, easy: 0, miss: 0, blank: 0 };
      for (const { set } of rirSets) rir[rirStatus(set)] += 1;
      const rirTotal = rir.hit + rir.easy + rir.miss + rir.blank;

      const bits = [];
      if (rir.easy) bits.push(`${rir.easy} too easy`);
      if (rir.miss) bits.push(`${rir.miss} miss`);
      if (rir.blank) bits.push(`${rir.blank} blank`);

      const muscles = MUSCLE_ORDER.map((name) => {
        const lifts = new Map();
        for (const session of [...sessions].reverse()) {
          if (session.superseded) continue;
          for (const set of session.sets) {
            if (set.muscle !== name) continue;
            const key = `${set.exercise}::${set.extra ? "extra" : "main"}`;
            if (!lifts.has(key)) {
              lifts.set(key, { exercise: set.exercise, extra: !!set.extra, instances: [] });
            }
            const n = set.count || 1;
            for (let i = 0; i < n; i++) {
              lifts.get(key).instances.push({ date: session.date, set });
            }
          }
        }
        let latest = null;
        for (const session of sessions) {
          if (session.superseded) continue;
          const mine = session.sets.filter((s) => s.muscle === name);
          if (!mine.length) continue;
          latest = mine.find((s) => !s.extra) || mine[0];
          break;
        }
        const liftList = [...lifts.values()].sort((a, b) => {
          const aLast = a.instances[a.instances.length - 1].date;
          const bLast = b.instances[b.instances.length - 1].date;
          if (aLast !== bLast) return aLast < bLast ? 1 : -1;
          if (a.exercise === b.exercise && a.extra !== b.extra) return a.extra ? 1 : -1;
          return 0;
        });
        return { name, latest, lifts: liftList };
      }).filter((m) => m.latest);

      const recent = sessions.slice(0, 3);
      const { start, end, days } = windowDays(data.asOf);

      const byDate = new Map();
      for (const s of sessions) {
        if (s.superseded) continue;
        byDate.set(s.date, s);
      }

      const overallMarks = new Map();
      for (const [iso, s] of byDate) {
        if (iso < start || iso > end) continue;
        const n = countedLifts(s);
        if (n === 0) continue;
        const work = s.sets.reduce((sum, set) => sum + dose(set), 0);
        overallMarks.set(iso, {
          dose: work,
          cls: n >= data.rules.sessionSize ? "full" : "short",
          title: `${formatPH(iso)} · ${n} of ${data.rules.sessionSize} · dose ${work.toFixed(1)}`
        });
      }
      const overallMax = Math.max(0, ...[...overallMarks.values()].map((m) => m.dose));

      const app = document.getElementById("app");
      app.innerHTML = `
        <dl class="stats">
          <div><dt>Last complete</dt><dd>${formatPH(lastComplete.date)}</dd></div>
          <div><dt>Next due</dt><dd>${formatPH(nextDue)}</dd></div>
          <div><dt>Last session</dt><dd>${counted} of ${data.rules.sessionSize}</dd></div>
          <div><dt>RIR 2–3</dt><dd>${rir.hit} of ${rirTotal}</dd></div>
        </dl>
        <p class="note">6 lifts · target RIR 2–3 · no more than 2 days${bits.length ? ` · ${bits.join(" · ")}` : ""}</p>

        <p class="kicker">Last ${WINDOW_DAYS} days</p>
        ${renderStrip(days, overallMarks, overallMax, `Session dose from ${shortPH(start)} to ${shortPH(end)}`)}
        <p class="hint">Height is dose. Green is ${data.rules.sessionSize} of ${data.rules.sessionSize}. Gaps are rest or skipped. Extra sets add height, not the count.</p>

        <p class="kicker">Muscles</p>
        ${muscles.map((muscle) => {
          const marks = new Map();
          for (const [iso, s] of byDate) {
            if (iso < start || iso > end) continue;
            const mine = s.sets.filter((set) => set.muscle === muscle.name);
            if (!mine.length) continue;
            const work = mine.reduce((sum, set) => sum + dose(set), 0);
            const main = mine.find((set) => !set.extra) || mine[0];
            marks.set(iso, {
              dose: work,
              cls: "work",
              title: [shortPH(iso), `dose ${work.toFixed(1)}`, formatLine(main)].join(" · ")
            });
          }
          const max = Math.max(0, ...[...marks.values()].map((m) => m.dose));
          return `
          <article class="card">
            <h2>${muscle.name}</h2>
            <p class="latest">${formatLine(muscle.latest)}${muscle.latest.extra ? " · extra" : ""}</p>
            ${renderStrip(days, marks, max, `${muscle.name} dose from ${shortPH(start)} to ${shortPH(end)}`)}
          </article>`;
        }).join("")}

        <p class="kicker">Recent sessions</p>
        <ol class="sessions">
          ${recent.map((s) => {
            const n = countedLifts(s);
            const label = s.status === "complete"
              ? `complete · ${n} of ${data.rules.sessionSize}`
              : `${s.status} · ${n} of ${data.rules.sessionSize}`;
            return `<li><span class="when">${formatPH(s.date)}</span><span class="state">${label}</span></li>`;
          }).join("")}
        </ol>
      `;
    }

    fetch("data.json")
      .then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(render)
      .catch(() => {
        document.getElementById("app").innerHTML =
          `<p class="err">Could not load the log snapshot.</p>`;
      });
  </script>
</body>
</html>
